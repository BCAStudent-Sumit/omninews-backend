databases:
  - name: omninews-db
    databaseName: omninews
    user: omninews_user
    plan: free

services:
  - type: web
    name: omninews-backend
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn omninews_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omninews-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
