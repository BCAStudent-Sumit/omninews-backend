name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (at minute 0, 10, 20, 30, 40, 50)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OmniNews Backend API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://omninews-backend.onrender.com/")
          echo "Render Backend responded with HTTP $response"
          if [ "$response" -eq 200 ] || [ "$response" -eq 301 ] || [ "$response" -eq 302 ]; then
            echo "Render Backend is alive and awake!"
          else
            echo "Ping warning: HTTP $response"
          fi
